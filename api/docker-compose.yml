# EBO SE 2 — full stack: the engine (holds the Agora session) + a FastAPI control API in front.
# Your consuming app talks ONLY to ebo-api (:8080). Configure everything in .env (see .env.example).
name: ebo-se2

services:
  ebo-engine:
    build: ../ebo                 # the existing engine image (bundles the Agora SDK, ffmpeg, RTSP)
    platform: linux/amd64         # required: the Agora SDK is x86_64 only
    restart: unless-stopped
    environment:
      EBO_EMAIL: ${EBO_EMAIL}
      EBO_PASSWORD: ${EBO_PASSWORD}
      EBO_PAYLOAD_KEY: ${EBO_PAYLOAD_KEY}
      EBO_SIGN_KEY: ${EBO_SIGN_KEY}
      EBO_HOST: ${EBO_HOST:-ebox-eu.enabotserverintl.com}
      EBO_REGION: ${EBO_REGION:-GB}
      EBO_API_TOKEN: ${EBO_API_TOKEN}
      EBO_VIDEO: ${EBO_VIDEO:-true}
      EBO_AUDIO: ${EBO_AUDIO:-true}
      EBO_VIDEO_MAX_HEIGHT: ${EBO_VIDEO_MAX_HEIGHT:-720}
      EBO_TTS_TIMBRE: ${EBO_TTS_TIMBRE:-en-US-AvaMultilingualNeural}
      EBO_TTS_LANGUAGE: ${EBO_TTS_LANGUAGE:-en-US}
      # WebRTC ICE hosts: IP(s) the browser can reach (mediamtx advertises these). Through Docker
      # you MUST set this — 127.0.0.1 for a browser on this machine, or your LAN IP for other devices.
      EBO_HOST_IPS: ${EBO_HOST_IPS:-127.0.0.1}
      # 0 = never drop the Agora session (keeps control alive for an interactive API);
      # set minutes >0 to let the robot sleep after idle.
      EBO_STANDBY_MINUTES: ${EBO_STANDBY_MINUTES:-0}
    volumes:
      - engine_data:/data
    ports:
      - "${RTSP_PORT:-8554}:8554"          # RTSP — optional, direct low-latency players
      - "${WEBRTC_PORT:-8189}:8189/tcp"    # WebRTC/WHEP signalling (low-latency browser video)
      - "${WEBRTC_PORT:-8189}:8189/udp"    # WebRTC media/ICE
    expose:
      - "8098"                             # data API — internal to the compose network only

  ebo-api:
    build: .
    restart: unless-stopped
    depends_on: [ebo-engine]
    # live-edit the API + cockpit without rebuilding (remove for a sealed production image;
    # a container restart reloads the code since uvicorn runs without --reload)
    volumes:
      - ./app:/app/app
      - ../game/web:/app/game_web:ro     # the AR game frontend, served at /game
    environment:
      ENGINE_URL: http://ebo-engine:8098
      ENGINE_TOKEN: ${EBO_API_TOKEN}          # must match the engine's EBO_API_TOKEN
      API_KEYS: ${API_KEYS}                    # client bearer keys (comma-separated)
      ALLOW_NO_AUTH: ${ALLOW_NO_AUTH:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      RTSP_PUBLIC_HOST: ${RTSP_PUBLIC_HOST:-localhost}
      RTSP_PORT: ${RTSP_PORT:-8554}
    ports:
      - "${API_PORT:-8080}:8080"

  # AR game perception worker. Optional & heavy (torch + models) — only starts with the "game"
  # profile:  docker compose --profile game up -d --build ebo-vision
  ebo-vision:
    build: ../game/vision
    restart: unless-stopped
    profiles: ["game"]
    depends_on: [ebo-engine, ebo-api]
    environment:
      MODE: ${VISION_MODE:-fake}                 # fake (synthetic dets, no models) | real
      RTSP_URL: rtsp://ebo-engine:8554/ebo
      EBO_API_URL: http://ebo-api:8080
      EBO_API_KEY: ${VISION_API_KEY}             # one of API_KEYS
      ROBOT_ID: ebo
      FPS: ${VISION_FPS:-6}
      ENABLE_REID: ${VISION_REID:-true}
      DETECT_ALL: ${VISION_DETECT_ALL:-false}   # prompt-free: detect everything
      PROPS: ${VISION_PROPS:-shoe,slipper,backpack,handbag,bottle,cup,book,ball,potted plant,remote}
    volumes:
      - vision_weights:/weights                  # persist auto-downloaded model weights

volumes:
  engine_data:
  vision_weights:
